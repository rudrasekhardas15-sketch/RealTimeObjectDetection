<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Object Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">

            <div>
                <p class="tag">COMPUTER VISION</p>

                <h1>Real-Time Object Detection</h1>

                <p class="subtitle">
                    Detect objects from your webcam using
                    TensorFlow.js and COCO-SSD.
                </p>
            </div>

            <div class="model-status" id="modelStatus">
                Loading AI Model...
            </div>

        </header>


        <!-- Main Detection Area -->
        <main>

            <section class="camera-card">

                <!-- Camera -->
                <div class="camera-container">

                    <video
                        id="video"
                        autoplay
                        muted
                        playsinline>
                    </video>

                    <canvas id="canvas"></canvas>

                    <div class="camera-message" id="cameraMessage">
                        AI model is loading...
                    </div>

                </div>


                <!-- Controls -->
                <div class="controls">

                    <button
                        id="startButton"
                        disabled>

                        Start Camera

                    </button>


                    <button
                        id="stopButton"
                        class="stop-button"
                        disabled>

                        Stop Camera

                    </button>


                    <div class="confidence-control">

                        <label for="confidence">
                            Confidence:
                        </label>

                        <input
                            type="range"
                            id="confidence"
                            min="0.20"
                            max="0.90"
                            step="0.05"
                            value="0.50">

                        <span id="confidenceValue">
                            50%
                        </span>

                    </div>

                </div>

            </section>


            <!-- Statistics -->
            <section class="stats">

                <div class="stat-card">

                    <span class="stat-title">
                        Objects
                    </span>

                    <strong id="objectCount">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-title">
                        FPS
                    </span>

                    <strong id="fps">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-title">
                        Camera
                    </span>

                    <strong id="cameraStatus">
                        Off
                    </strong>

                </div>

            </section>


            <!-- Detection List -->
            <section class="detections-card">

                <h2>
                    Detected Objects
                </h2>

                <div id="detections">

                    <p class="empty">
                        No objects detected yet.
                    </p>

                </div>

            </section>

        </main>


        <!-- Footer -->
        <footer>

            <p>
                Built with HTML, CSS, JavaScript,
                TensorFlow.js & COCO-SSD
            </p>

        </footer>

    </div>


    <!-- TensorFlow.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">
    </script>


    <!-- COCO-SSD -->
    <script
        src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js">
    </script>


    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>

</html>
